<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto's - VCL Lent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="main-nav" role="navigation" aria-label="Hoofdnavigatie">
            <div class="logo">
                <a href="index.html">
                    <img src="images/logo.jpg" alt="Vélo Club Lent Logo" class="logo-image">
                    <div class="logo-text">
                        <span class="logo-top">vélo club</span>
                        <span class="logo-bottom">LENT</span>
                    </div>
                </a>
            </div>
            <button class="menu-toggle" aria-expanded="false" aria-controls="menu-items">
                <span class="hamburger"></span>
                <span class="menu-text">Menu</span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Over ons</a></li>
                <li><a href="routes.html">Routes donderdag</a></li>
                <li><a href="routes-sunday.html">Routes zondag</a></li>
                <li><a href="safety.html">Veiligheid & regels</a></li>
                <li><a href="photos.html" aria-current="page">Foto's</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="photos-header">
            <h1>Foto's</h1>
            <p>Een selectie van onze mooiste momenten</p>
        </section>

        <section class="photos-grid">
            <!-- Foto 1 -->
            <div class="photo-item">
                <img src="images/foto1.jpg" alt="Fietsers bij de dijk" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fietsers bij de dijk"></button>
            </div>

            <!-- Foto 2 -->
            <div class="photo-item">
                <img src="images/foto2.jpg" alt="Fietsers in de bergen" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fietsers in de bergen"></button>
            </div>

            <!-- Foto 3 -->
            <div class="photo-item">
                <img src="images/foto3.jpg" alt="Groepsfoto fietsers" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Groepsfoto fietsers"></button>
            </div>

            <!-- Foto 4 -->
            <div class="photo-item">
                <img src="images/foto4.jpg" alt="Fiets bij rustpunt" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fiets bij rustpunt"></button>
            </div>

            <!-- Foto 5 -->
            <div class="photo-item">
                <img src="images/foto5.jpg" alt="Fietsers bij finish" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fietsers bij finish"></button>
            </div>

            <!-- Foto 6 -->
            <div class="photo-item">
                <img src="images/foto6.jpg" alt="Groepsfoto bij monument" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Groepsfoto bij monument"></button>
            </div>

            <!-- Foto 7 -->
            <div class="photo-item">
                <img src="images/foto7.jpg" alt="Fietsers onderweg" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fietsers onderweg"></button>
            </div>

            <!-- Foto 8 -->
            <div class="photo-item">
                <img src="images/foto8.jpg" alt="Groepsfoto tijdens pauze" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Groepsfoto tijdens pauze"></button>
            </div>

            <!-- Foto 9 -->
            <div class="photo-item">
                <img src="images/foto9.jpg" alt="Fietsers in actie" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fietsers in actie"></button>
            </div>

            <!-- Foto 10 -->
            <div class="photo-item">
                <img src="images/foto10.jpg" alt="Fietsers op mooie locatie" loading="lazy">
                <button class="photo-button" type="button" aria-label="Vergroot foto: Fietsers op mooie locatie"></button>
            </div>
        </section>

        <div class="lightbox" role="dialog" aria-modal="true" aria-label="Foto bekijken" hidden>
            <button class="lightbox-close" type="button" aria-label="Sluit foto">&times;</button>
            <button class="lightbox-prev" type="button" aria-label="Vorige foto">&#8249;</button>
            <div class="lightbox-content">
                <img class="lightbox-image" src="" alt="">
            </div>
            <button class="lightbox-next" type="button" aria-label="Volgende foto">&#8250;</button>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Contact</h3>
                <p>Email: <a href="mailto:VeloClubLent@gmail.com">VeloClubLent@gmail.com</a></p>
            </div>
        </div>
        <div class="footer-sponsors" aria-label="Sponsoren">
            <a href="https://wavenijmegen.nl/" target="_blank" rel="noopener noreferrer">
                <img src="Sponsorlogos/wave-nijmegen.svg" alt="WAVE Nijmegen">
            </a>
            <a href="https://www.instagram.com/roadman_custom_cycling/" target="_blank" rel="noopener noreferrer">
                <img src="Sponsorlogos/roadman-custom-cycling.svg" alt="Roadman Custom Cycling">
            </a>
            <a href="https://cafe-etenendrinken.nl/lent/" target="_blank" rel="noopener noreferrer">
                <img src="Sponsorlogos/eten-en-drinken.svg" alt="Cafe Eten en Drinken Lent">
            </a>
            <a href="https://www.aandemaasadvocatuur.nl/" class="footer-sponsor-dark" target="_blank" rel="noopener noreferrer">
                <img src="Sponsorlogos/aan-de-maas-advocatuur.svg" alt="Aan de Maas Advocatuur">
            </a>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 VCL Lent. Alle rechten voorbehouden.</p>
            <span class="site-version">v0.3</span>
        </div>
    </footer>

    <script src="scripts/main.js"></script>
    <script src="scripts/lightbox.js"></script>
</body>
</html>
